[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-for-malaria"
version = "0.2.0"
description = "ML applied for Malaria"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["machine learning", "malaria", "haemozoin"]

authors = [
    { name = "David Kuter" }
]
maintainers = [
    { name = "David Kuter" }
]

dependencies = [
    "datamol",
    "hyperopt",
    "loguru",
    "matplotlib",
    "numpy",
    "pandas",
    "pyarrow",
    "rdkit>=2024.3.5",
    "shap",
    "scikit-learn",
    "xgboost",
    "tabulate>=0.10.0",
    "pandera>=0.32.1",
]

[dependency-groups]
dev = [
    "coverage",
    "pytest",
    "ruff",
]

[tool.ruff]
target-version = "py311"
extend-exclude = ["pyproject.toml"]

[tool.setuptools.packages.find]
include = ["ml_for_malaria*"]

[tool.uv]
default-groups = ["dev"]
# Repo lives on a Windows drive; WSL cannot hardlink from the Linux uv cache.
link-mode = "copy"
